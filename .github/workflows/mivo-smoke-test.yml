# Temporary: asks Mivo a few questions and saves the raw replies to the
# `mivo-smoke-test` branch. Triggered by editing .github/smoke-request.json.
name: Mivo smoke test

on:
  push:
    branches: [main]
    paths: [".github/smoke-request.json"]

permissions:
  contents: write

jobs:
  ask:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ask Mivo
        env:
          URL: https://jwrafjkdzdffrznsnqmh.supabase.co/functions/v1/ask_mivo_v2
          KEY: sb_publishable_sU2nPl2cL4T0Epn3eocnZA_G_XohwGH
        run: |
          mkdir -p /tmp/out
          jq -c '.questions[]' .github/smoke-request.json | while read -r q; do
            start=$(date +%s%3N)
            body=$(jq -nc --argjson q "$q" '{question: $q}')
            res=$(curl -sS -m 60 -w '\n%{http_code}' -X POST "$URL" \
              -H "apikey: $KEY" -H "Content-Type: application/json" -d "$body")
            ms=$(( $(date +%s%3N) - start ))
            code=$(echo "$res" | tail -1)
            json=$(echo "$res" | sed '$d')
            jq -nc --argjson q "$q" --arg code "$code" --arg ms "$ms" --arg raw "$json" \
              '{question: $q, status: $code, ms: $ms, reply: ($raw | fromjson? // $raw)}' >> /tmp/out/results.jsonl
          done
          cd /tmp/out
          git init -q -b mivo-smoke-test
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Mivo smoke test"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" mivo-smoke-test
